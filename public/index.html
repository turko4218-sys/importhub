<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>importhub — Amazon a MercadoLibre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>importhub</h1>

      <form id="import-form" class="import-form">
        <label for="import-url">Enlace de Amazon</label>
        <input id="import-url" type="url" placeholder="https://www.amazon.com/dp/XXXXXXXXXX" required />
        <button type="submit">↓ Importar de Amazon</button>
        <p id="import-status" class="hint"></p>
      </form>

      <h2>Jobs</h2>
      <ul id="job-list" class="job-list"></ul>
    </aside>

    <main class="editor" id="editor">
      <p class="empty-state">Importa una URL de Amazon o elegi un job de la lista para editarlo.</p>
    </main>
  </div>

  <template id="editor-template">
    <h2>Editar producto</h2>

    <label>Título *</label>
    <input data-field="title" type="text" />

    <div class="row">
      <div>
        <label>Enlace de Amazon</label>
        <input data-field="url" type="text" readonly />
      </div>
      <div>
        <label>ASIN</label>
        <input data-field="asin" type="text" readonly />
      </div>
    </div>

    <div class="row row-3">
      <div>
        <label>Marca</label>
        <input data-field="brand" type="text" />
      </div>
      <div>
        <label>Modelo</label>
        <input data-field="model" type="text" />
      </div>
      <div>
        <label>Código de barras (UPC/EAN/GTIN)</label>
        <input data-field="barcode" type="text" placeholder="se completa solo al importar, si esta disponible" />
      </div>
    </div>

    <div class="row row-3">
      <div>
        <label>Precio (USD) *</label>
        <input data-field="priceUsd" type="number" step="0.01" min="0" />
      </div>
      <div>
        <label>Peso (kg)</label>
        <input data-field="weightKg" type="number" step="0.001" min="0" />
      </div>
      <div>
        <label>Costo envío intl. (USD)</label>
        <input data-field="shippingCostUsd" type="number" step="0.01" min="0" placeholder="vacio = estimar por peso" />
      </div>
    </div>

    <label class="checkbox-row">
      <input data-field="availableOnAmazon" type="checkbox" />
      Disponible en Amazon
    </label>

    <label>Imágenes (una URL por línea — se usan al publicar)</label>
    <textarea data-field="images" rows="4"></textarea>
    <div class="thumbnails" id="thumbnails"></div>

    <label>Descripción</label>
    <textarea data-field="description" rows="6"></textarea>

    <label>Videos de Amazon (solo referencia: ML no acepta videos por API)</label>
    <textarea data-field="videos" rows="2" readonly></textarea>

    <div class="actions">
      <button type="button" id="save-btn">Guardar cambios</button>
      <button type="button" id="publish-btn" class="primary">Publicar en MercadoLibre</button>
    </div>
    <p id="editor-status" class="hint"></p>
    <p id="ml-result" class="ml-result"></p>
  </template>

  <script src="/app.js"></script>
</body>
</html>
